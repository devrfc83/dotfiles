<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Aptos Display se declara también como familia "Aptos" (estilo "Display"),
       lo que hace que "Aptos" a secas pueda resolverse a Aptos Display.
       Se deja solo en su propia familia "Aptos Display". -->
  <match target="scan">
    <test name="fullname" compare="contains"><string>Aptos Display</string></test>
    <edit name="family" mode="assign" binding="same"><string>Aptos Display</string></edit>
  </match>
</fontconfig>
