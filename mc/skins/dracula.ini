[skin]
    description = Dracula

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[core]
    _default_ = white;default
    selected = white;red
    marked = black;brightgreen
    markselect = brightgreen;blue
    gauge = black;white
    input = white;black
    inputunchanged = brightgreen;black
    inputmark = black;white
    disabled = brightgreen;black
    reverse = brightgreen;black
    commandlinemark = black;white
    header = white;black
    inputhistory =
    commandhistory =

[dialog]
    _default_ = white;black
    dfocus = white;blue
    dhotnormal = brightgreen;black
    dhotfocus = brightgreen;blue
    dtitle = brightgreen;black

[error]
    _default_ = red;black
    errdfocus = black;red
    errdhotnormal = brightred;black
    errdhotfocus = brightgreen;red
    errdtitle = brightgreen;black

[filehighlight]
    directory = blue;
    executable = brightgreen;
    symlink = brightgreen;
    hardlink =
    stalelink = brightred;
    device = brightgreen;
    special = brightgreen;
    core = red;
    temp = brightgreen;
    archive = brightgreen;
    doc = white;
    source = brightcyan;
    media = brightgreen;
    graph = cyan;
    database = brightred;

[menu]
    _default_ = white;black
    menusel = white;blue
    menuhot = brightgreen;black
    menuhotsel = brightgreen;blue
    menuinactive = brightgreen;black

[popupmenu]
    _default_ = white;black
    menusel = white;blue
    menutitle = white;black

[buttonbar]
    hotkey = white;blue
    button = white;black

[statusbar]
    _default_ = white;black

[help]
    _default_ = white;black
    helpitalic = red;black
    helpbold = brightgreen;black
    helplink = blue;black
    helpslink = white;blue
    helptitle = brightgreen;black

[editor]
    _default_ = white;black
    editbold = brightgreen;blue
    editmarked = black;cyan
    editwhitespace = brightblue;blue
    editlinestate = white;cyan
    bookmark = white;red
    bookmarkfound = black;brightgreen
    editrightmargin = brightblue;black
    editframe = brightgreen;
    editframeactive = white;
    editframedrag = brightblue;

[viewer]
    _default_ = white;black
    viewbold = brightgreen;blue
    viewunderline = brightred;blue
    viewselected = brightgreen;cyan

[diffviewer]
    added = white;brightgreen
    changedline = blue;cyan
    changednew = red;cyan
    changed = white;cyan
    removed = white;red
    error = red;white

[widget-common]
    sort-sign-up = ↑
    sort-sign-down = ↓

[widget-panel]
    hiddenfiles-sign-show = •
    hiddenfiles-sign-hide = ○
    history-prev-item-sign = «
    history-next-item-sign = »
    history-show-list-sign = ^
    filename-scroll-left-char = «
    filename-scroll-right-char = »

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
