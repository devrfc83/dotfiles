# Ajustes propios de RetroArch. No es un archivo completo: dotfiles-install.sh
# reemplaza o agrega estas claves en ~/.config/retroarch/retroarch.cfg y deja el
# resto como está (RetroArch reescribe ese archivo entero al salir).
# Formato: clave = "valor", como en el archivo de RetroArch.

# Start + Select abre el menú durante un juego (valores en /etc/retroarch.cfg)
input_menu_toggle_gamepad_combo = "4"

# «Cargar contenido» parte en la carpeta de juegos
rgui_browser_directory = "~/Juegos"

# Pantalla completa, con píxeles de tamaño entero (bordes negros a los lados)
video_fullscreen = "true"
video_scale_integer = "true"

# Cores: los del sistema más los compilados (dotfiles-install.sh arma ese
# directorio con enlaces; ver install-genesis-plus-gx.sh)
libretro_directory = "~/.config/retroarch/cores/"

# Perfiles de mandos: los del sistema más los corregidos de retroarch/autoconfig/
# (dotfiles-install.sh arma ese directorio con enlaces)
joypad_autoconfig_dir = "~/.config/retroarch/autoconfig/"
