# GameSir Nova Lite (también Nova Lite T4) con el receptor USB en modo PC
# (X-input): driver xpad, numeración estándar de Xbox 360.
# Reemplaza al perfil del mismo nombre de /usr/share/libretro/autoconfig/udev/,
# que cruza hombros y gatillos (LT/RT como L/R) y define Start dos veces.
input_driver = "udev"
input_device = "Generic X-Box pad"
input_device_display_name = "GameSir Nova Lite"
input_vendor_id = "13623"
input_product_id = "4160"

# Botones frontales (RetroPad usa la disposición de Nintendo: B abajo, A a la derecha)
input_b_btn = "0"
input_a_btn = "1"
input_y_btn = "2"
input_x_btn = "3"

# Hombros (LB/RB) y gatillos (LT/RT, ejes que van de -32767 en reposo a +32767)
input_l_btn = "4"
input_r_btn = "5"
input_l2_axis = "+2"
input_r2_axis = "+5"

input_select_btn = "6"
input_start_btn = "7"
input_menu_toggle_btn = "8"
input_l3_btn = "9"
input_r3_btn = "10"

# Cruceta
input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"

# Palancas
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+3"
input_r_x_minus_axis = "-3"
input_r_y_plus_axis = "+4"
input_r_y_minus_axis = "-4"

input_b_btn_label = "A"
input_a_btn_label = "B"
input_y_btn_label = "X"
input_x_btn_label = "Y"
input_l_btn_label = "LB"
input_r_btn_label = "RB"
input_l2_axis_label = "LT"
input_r2_axis_label = "RT"
input_select_btn_label = "View"
input_start_btn_label = "Menu"
input_menu_toggle_btn_label = "Home"
input_l3_btn_label = "Left Stick"
input_r3_btn_label = "Right Stick"
input_up_btn_label = "D-Pad Up"
input_down_btn_label = "D-Pad Down"
