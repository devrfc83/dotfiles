# sshd de estos dotfiles (lo instala fedora-install.sh en /etc/ssh/sshd_config.d/).
# Se lee antes que los de Fedora (40-, 50-): en sshd vale el primer valor de cada
# opción. La contraseña sigue permitida, para entrar desde equipos ajenos sin la
# llave; por eso, sin root, con menos intentos por conexión y menos tiempo para
# autenticarse. Fuera de casa sshd no responde: la zona public no tiene ssh
# (scripts/install-firewall.sh).

PermitRootLogin no
# Cuenta también las llaves que ofrece el agente
MaxAuthTries 3
LoginGraceTime 30
