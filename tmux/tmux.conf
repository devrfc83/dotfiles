# ── Plugins ───────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-online-status'

# ── Prefijo ───────────────────────────────────────────────────────────────────
set-option -g prefix C-a
unbind C-b
bind C-a send-prefix

# ── General ───────────────────────────────────────────────────────────────────
set-option -sg escape-time 10
set -g history-limit 99999
set -g visual-activity on
set -g bell-action any
set -g visual-bell on

# ── Bloqueo (protector de pantalla) ───────────────────────────────────────────
# Tras 10 minutos sin actividad, o con C-a C-l, muestra cmatrix; cualquier tecla vuelve
set -g lock-after-time 600
# -C blue: con la paleta Dracula de la terminal, el azul ANSI es morado
set -g lock-command "cmatrix -s -b -C blue"
bind C-l lock-client

# ── Color verdadero (termguicolors de Vim dentro de tmux) ─────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# ── Sincronización de paneles ─────────────────────────────────────────────────
# C-a S alterna on/off; C-a s queda libre para choose-session (lista de sesiones)
bind-key S set-window-option synchronize-panes \; display-message "Sincronización de paneles: #{?synchronize-panes,activada,desactivada}"

# ── CPU ───────────────────────────────────────────────────────────────────────
set -g @cpu_low_fg_color "#[fg=#50fa7b]"
set -g @cpu_medium_fg_color "#[fg=#f1fa8c]"
set -g @cpu_high_fg_color "#[fg=#ff5555]"

# ── Batería ───────────────────────────────────────────────────────────────────
set -g @batt_color_full_charge "#[fg=#50fa7b]"
set -g @batt_color_high_charge "#[fg=#50fa7b]"
set -g @batt_color_medium_charge "#[fg=#f1fa8c]"
set -g @batt_color_low_charge "#[fg=#ff5555]"

# ── Estado de la conexión ─────────────────────────────────────────────────────
set -g @online_icon "#[fg=#50fa7b]●"
set -g @offline_icon "#[fg=#ff5555]●"

# ── Barra de estado (paleta Dracula, scripts/lib/dracula.palette) ─────────────
# Barra en Current Line; la sesión y la ventana activa, en morado con texto oscuro
set -g status-style "bg=#44475a,fg=#f8f8f2"
set -g status-left-length 40
set -g status-right-length 150

set -g status-left "#[bg=#bd93f9,fg=#282a36,bold] #S #[bg=#44475a,fg=#bd93f9]"

set -g status-right "\
#[fg=#50fa7b] #{cpu_percentage} \
#[fg=#6272a4]│\
#[fg=#8be9fd] #{ram_percentage} \
#[fg=#6272a4]│\
#{battery_color_charge_fg}  #{battery_percentage} \
#[fg=#6272a4]│\
#{online_status} \
#[fg=#6272a4]│\
#[fg=#f1fa8c] #(~/.local/bin/tmux-weather) \
#[fg=#6272a4]│\
#[fg=#f8f8f2] %d-%b %H:%M "

set -g window-status-format "#[fg=#f8f8f2] #I:#W "
set -g window-status-current-format "#[bg=#bd93f9,fg=#282a36,bold] #I:#W "

set -g pane-border-style "fg=#6272a4"
set -g pane-active-border-style "fg=#bd93f9"
set -g message-style "bg=#f1fa8c,fg=#282a36,bold"

# ── Numeración de ventanas y paneles ──────────────────────────────────────────
set-option -g base-index 1
setw -g pane-base-index 1
setw -g automatic-rename on
setw -g mode-keys vi

# ── Atajos de teclado ─────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "Configuración de tmux recargada"
bind K kill-window
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# clipboard-copy (tmux/clipboard-copy.sh): wl-copy en Wayland, xclip en X11.
# WAYLAND_DISPLAY se actualiza al reconectarse, como DISPLAY.
set -ag update-environment WAYLAND_DISPLAY
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "~/.local/bin/clipboard-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "~/.local/bin/clipboard-copy"

# ── Ratón ─────────────────────────────────────────────────────────────────────
set-option -g mouse on

# ── Inicializar TPM (debe ir al final) ────────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'
