# ── Plugins ───────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-online-status'

# ── Prefix ────────────────────────────────────────────────────────────────────
set-option -g prefix C-a
unbind C-b
bind C-a send-prefix

# ── General ───────────────────────────────────────────────────────────────────
set-option -sg escape-time 10
set -g history-limit 10000
set -g visual-activity on
set -g bell-action any
set -g visual-bell on

# ── Pane synchronization ──────────────────────────────────────────────────────
bind-key S set-window-option synchronize-panes on
bind-key s set-window-option synchronize-panes off

# ── Weather ───────────────────────────────────────────────────────────────────
set -g @tmux-weather-location "Talca"
set -g @tmux-weather-unit "c"
set -g @tmux-weather-interval 15
set -g @tmux-weather-url "wttr.in/Talca?format=3&lang=es"

# ── CPU ───────────────────────────────────────────────────────────────────────
set -g @cpu_low_fg_color "#[fg=#4e9a06]"
set -g @cpu_medium_fg_color "#[fg=#c4a000]"
set -g @cpu_high_fg_color "#[fg=#cc0000]"

# ── Battery ───────────────────────────────────────────────────────────────────
set -g @batt_color_full_charge "#[fg=#4e9a06]"
set -g @batt_color_high_charge "#[fg=#4e9a06]"
set -g @batt_color_medium_charge "#[fg=#c4a000]"
set -g @batt_color_low_charge "#[fg=#cc0000]"

# ── Online status ─────────────────────────────────────────────────────────────
set -g @online_icon "#[fg=#4e9a06]●"
set -g @offline_icon "#[fg=#cc0000]●"

# ── Status bar (Tango palette) ────────────────────────────────────────────────
set -g status-style "bg=#2e3436,fg=#eeeeec"
set -g status-left-length 40
set -g status-right-length 150

set -g status-left "#[bg=#3465a4,fg=#eeeeec,bold] #S #[bg=#2e3436,fg=#3465a4]"

set -g status-right "\
#[fg=#4e9a06] #{cpu_percentage} \
#[fg=#555753]│\
#[fg=#729fcf] #{ram_percentage} \
#[fg=#555753]│\
#{battery_color_charge_fg}  #{battery_percentage} \
#[fg=#555753]│\
#{online_status} \
#[fg=#555753]│\
#[fg=#c4a000] #(curl -sf --user-agent curl 'wttr.in/Talca?format=3' 2>/dev/null) \
#[fg=#555753]│\
#[fg=#eeeeec] %d-%b %H:%M "

set -g window-status-format "#[fg=#babdb6] #I:#W "
set -g window-status-current-format "#[bg=#3465a4,fg=#eeeeec,bold] #I:#W "

set -g pane-border-style "fg=#555753"
set -g pane-active-border-style "fg=#3465a4"
set -g message-style "bg=#c4a000,fg=#2e3436,bold"

# ── Pane numbering ────────────────────────────────────────────────────────────
set-option -g base-index 1
setw -g pane-base-index 1
setw -g automatic-rename on
setw -g mode-keys vi

# ── Key bindings ──────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded!"
bind K kill-window
bind | split-window -h
bind - split-window -v
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# ── Mouse ─────────────────────────────────────────────────────────────────────
set-option -g mouse on

# ── Initialize TPM (keep at bottom) ───────────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'
