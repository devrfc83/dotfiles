; Ajustes propios de PHP (CLI y PHP-FPM). Lo instala scripts/fedora-install.sh en
; /etc/php.d/99-dotfiles.ini: se carga después de los .ini de Fedora y prevalece.

; Xdebug cargado pero apagado. Sin xdebug.mode, Xdebug 3 queda en modo develop y
; hace más lento todo PHP (Composer lo advierte). La variable XDEBUG_MODE tiene
; prioridad sobre este valor, así que se activa por comando:
;   XDEBUG_MODE=debug XDEBUG_SESSION=1 php script.php   (depurar con VSCodium)
;   XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-text
; PCOV (más rápido para cobertura) viene desactivado en Fedora (pcov.enabled = 0):
;   php -d pcov.enabled=1 vendor/bin/phpunit --coverage-text
xdebug.mode = off
